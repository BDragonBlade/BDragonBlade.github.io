<!DOCTYPE html>
<html>
    <head>
        <meta charset=""utf-8">
        <title>Project: Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
        <link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Roboto'>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <style>
        html,body,h1,h2,h3,h4,h5,h6 {font-family: "Roboto", sans-serif}
        </style>
    </head>
    <body class="w3-light-grey">
      <div class="w3-content w3-margin-top" style="max-width:1400px;">
        <div class="w3-row-padding"></div>
        <h1>Joshua D. Hardy</h1>

        <h2>About</h2>
            <p>
                I am a graduate of Augusta University with a B.S. in Computer Science. I have been coding since 2016, and am constantly trying to learn more.
            </p>
        
        <h3>
            Projects
        </h3>
            <p>
                Here are some of the projects I have worked on:
            </p>
            
        <div id="repo-list">Loading repositories...</div>

<script>
  const username = "BDragonBlade";
  const repoContainer = document.getElementById("repo-list");

  fetch(`https://api.github.com/users/${username}/repos?sort=updated`)
    .then(response => response.json())
    .then(repos => {
      repoContainer.innerHTML = ""; // Clear loading text
      repos.forEach(repo => {
        // Create an HTML card for each repository
        const repoCard = `
          <div class="repo-card" style="border: 1px solid #ddd; padding: 10px; margin: 10px 0;">
            <h3><a href="${repo.html_url}" target="_blank">${repo.name}</a></h3>
            <p>${repo.description || "No description provided."}</p>
            <span>⭐ ${repo.language || "Unknown"} | 🍴 ${repo.forks_count}</span>
          </div>
        `;
        repoContainer.innerHTML += repoCard;
      });
    })
    .catch(error => {
      repoContainer.innerHTML = "Failed to load repositories.";
      console.error(error);
    });
</script>

        
    </body>

</html>
